<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rook's Heartbeat ♜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e8e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .rook { font-size: 72px; margin-bottom: 8px; }
  h1 { font-size: 28px; letter-spacing: 4px; font-weight: 700; margin-bottom: 32px; }
  h1 .sub { display: block; font-size: 13px; letter-spacing: 2px; color: #888; font-weight: 400; margin-top: 6px; }
  #pill {
    font-size: 44px; font-weight: 800; letter-spacing: 6px;
    padding: 18px 54px; border-radius: 999px; margin-bottom: 16px;
    transition: all 0.4s ease;
  }
  #pill.alive {
    color: #0a0a0f; background: #3dff88;
    box-shadow: 0 0 60px rgba(61,255,136,0.45);
    animation: pulse 2s ease-in-out infinite;
  }
  #pill.silent {
    color: #fff; background: #ff3b5c;
    box-shadow: 0 0 60px rgba(255,59,92,0.4);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(61,255,136,0.35); }
    50% { box-shadow: 0 0 80px rgba(61,255,136,0.6); }
  }
  #ago { font-size: 20px; color: #bbb; margin-bottom: 32px; font-variant-numeric: tabular-nums; }
  #vitals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; max-width: 640px; width: 100%; margin-bottom: 32px;
  }
  .card {
    background: #14141c; border: 1px solid #26262f; border-radius: 12px;
    padding: 14px 10px;
  }
  .card .label { font-size: 11px; letter-spacing: 1.5px; color: #777; margin-bottom: 6px; }
  .card .val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: #3dff88; } .down { color: #ff3b5c; }
  footer { font-size: 13px; color: #666; max-width: 480px; line-height: 1.6; }
  #err { color: #ff3b5c; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
</style>
</head>
<body>
  <div class="rook">♜</div>
  <h1>ROOK'S HEARTBEAT<span class="sub">machine liveness beacon</span></h1>
  <div id="pill" class="silent">···</div>
  <div id="err"></div>
  <div id="ago">waiting for first beat…</div>
  <div id="vitals"></div>
  <footer>Bookmark this page. If it ever says <b style="color:#ff3b5c">SILENT</b>, Rook's machine is down — not your app.<br>Beats land every 5 minutes. Stale after 15.</footer>

<script>
const API = "https://api.github.com/repos/AgenCi-MAIN/rook-heartbeat/contents/heartbeat.json";
const STALE_MS = 15 * 60 * 1000;
let lastBeat = null, lastData = null;

function fmtAgo(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + (s % 60) + "s ago";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m ago";
}

function render() {
  const pill = document.getElementById("pill");
  const ago = document.getElementById("ago");
  const vitals = document.getElementById("vitals");
  if (!lastBeat) {
    pill.textContent = "SILENT"; pill.className = "silent";
    ago.textContent = "no beat received yet";
    return;
  }
  const age = Date.now() - lastBeat;
  const alive = age < STALE_MS;
  pill.textContent = alive ? "ALIVE" : "SILENT";
  pill.className = alive ? "alive" : "silent";
  ago.textContent = "last beat: " + fmtAgo(age);
  if (lastData) {
    const p = lastData.lanes || lastData.proxies || {};
    const wsl = p["wsl"] !== undefined ? p["wsl"] : p["8222"];
    const mac = p["mac"] !== undefined ? p["mac"] : p["8223"];
    const pc  = p["pc"]  !== undefined ? p["pc"]  : p["8224"];
    const dot = v => v === "up" ? '<span class="up">● up</span>' : '<span class="down">● down</span>';
    vitals.innerHTML =
      card("BEAT (CHICAGO)", new Date(lastBeat).toLocaleString("en-US", {timeZone: "America/Chicago"})) +
      card("SSH 8222 · WSL", dot(wsl)) +
      card("TAILSCALE · MAC", dot(mac)) +
      card("SSH 8224 · PC", dot(pc)) +
      card("VM UPTIME", lastData.uptime_human || "—") +
      card("BOOT", (lastData.boot_id || "—").slice(0, 8) + "…");
  }
}
function card(label, val) {
  return '<div class="card"><div class="label">' + label + '</div><div class="val">' + val + '</div></div>';
}

async function poll() {
  try {
    const r = await fetch(API + "?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const data = JSON.parse(atob(j.content.replace(/\n/g, "")));
    lastBeat = new Date(data.beat).getTime();
    lastData = data;
    document.getElementById("err").textContent = "";
  } catch (e) {
    document.getElementById("err").textContent = "can't reach heartbeat data (" + e.message + ")";
    lastBeat = null;
  }
  render();
}

poll();
setInterval(poll, 60 * 1000);
setInterval(render, 1000);
</script>
</body>
</html>
